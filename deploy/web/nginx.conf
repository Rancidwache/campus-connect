# Public entrypoint: serves the installable PWA and forwards every API / upload /
# websocket request into the WAF (which then hits the Kong gateway, then the API).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream waf {
  server waf:8080;
}

server {
  listen 80;
  server_name _;

  # Uploaded media (local storage driver) and REST + Socket.IO all go via the WAF.
  location ~ ^/(api|uploads|socket\.io)(/|$) {
    proxy_pass http://waf;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;
    client_max_body_size 60m;   # allow the listing video upload
  }

  # The PWA itself — SPA fallback, with long-cache for hashed assets.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
